name: Give Bot Buddy a coffee
description: A small caffeine boost for the profile robot.
title: '[buddy] coffee'
body:
  - type: markdown
    attributes:
      value: |
        Give Bot Buddy a coffee. Keep the exact title so the robot can recognize it.
        Each visitor can perform one interaction every 15 minutes. Valid commands are closed automatically; repeated requests during cooldown have no effect.
        Your public GitHub username and this issue number become part of the public interaction record.
  - type: checkboxes
    id: confirm
    attributes:
      label: Coffee delivery
      options:
        - label: Give Bot Buddy a coffee.
          required: true

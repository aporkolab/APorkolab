name: Help Bot Buddy debug
description: Pair with the profile robot for a little debugging.
title: '[buddy] debug'
body:
  - type: markdown
    attributes:
      value: |
        Help Bot Buddy debug. Keep the exact title so the robot can recognize it.
        Each visitor can perform one interaction every 15 minutes. Valid commands are closed automatically; repeated requests during cooldown have no effect.
        Your public GitHub username and this issue number become part of the public interaction record.
  - type: checkboxes
    id: confirm
    attributes:
      label: Help Bot Buddy debug
      options:
        - label: Help Bot Buddy debug.
          required: true
